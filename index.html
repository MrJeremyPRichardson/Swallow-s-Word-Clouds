<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>2nd Grade Word Cloud Maker</title>
<style>
  body { font-family: 'Comic Sans MS', 'Chalkboard SE', sans-serif; background: #f0f8ff; margin: 0; padding: 15px; display: flex; justify-content: center; user-select: none; }
  .box { max-width: 750px; width: 100%; background: #fff; padding: 20px; border-radius: 24px; box-shadow: 0 8px 20px rgba(0,0,0,0.1); text-align: center; }
  h1 { color: #8854d0; margin: 0 0 5px; font-size: 2rem; }
  p { color: #57606f; margin: 0 0 15px; font-size: 1.1rem; }
  textarea { width: 100%; height: 110px; padding: 12px; border: 4px solid #a55eea; border-radius: 16px; font-size: 1.3rem; font-family: inherit; box-sizing: border-box; margin-bottom: 12px; }
  .controls { display: flex; flex-wrap: wrap; justify-content: space-around; background: #f1f2f6; padding: 12px; border-radius: 16px; margin-bottom: 15px; gap: 10px; }
  .label { font-weight: bold; display: block; margin-bottom: 6px; color: #2f3542; }
  .c-btn { width: 38px; height: 38px; border-radius: 50%; border: 3px solid #fff; box-shadow: 0 2px 5px rgba(0,0,0,0.2); cursor: pointer; }
  .c-btn.active { border-color: #2f3542; transform: scale(1.15); }
  .s-btn { background: #fff; border: 2px solid #ced6e0; padding: 8px 14px; font-size: 1rem; font-weight: bold; font-family: inherit; border-radius: 12px; cursor: pointer; }
  .s-btn.active { background: #8854d0; color: #fff; border-color: #8854d0; }
  .go-btn { background: #ffa502; color: #fff; border: none; padding: 14px 28px; font-size: 1.5rem; font-weight: bold; font-family: inherit; border-radius: 50px; cursor: pointer; box-shadow: 0 5px #eccc68; width: 100%; max-width: 320px; margin-bottom: 15px; }
  .go-btn:active { transform: translateY(3px); box-shadow: 0 2px #eccc68; }
  #cloud { width: 100%; height: 440px; border: 4px dashed #8854d0; border-radius: 16px; background: #fafafa; position: relative; overflow: hidden; display: none; }
  #shape-bg { position: absolute; top: 0; left: 0; width: 100%; height: 100%; pointer-events: none; }
  .word { position: absolute; font-weight: bold; white-space: nowrap; transform: translate(-50%, -50%); z-index: 2; }
</style>
</head>
<body>
<div class="box">
  <h1>☁️ Class Word Cloud Maker ☁️</h1>
  <p>Type your words, pick your look, and tap the big button!</p>
  <textarea id="txt" placeholder="Type words here with spaces between them..."></textarea>
  <div class="controls">
    <div>
      <span class="label">🎨 Pick Colors</span>
      <button type="button" class="c-btn active" data-p="pg" style="background:linear-gradient(135deg,#a55eea,#718093,#2f3640)"></button>
      <button type="button" class="c-btn" data-p="br" style="background:linear-gradient(135deg,#ff4757,#2ed573,#1e90ff)"></button>
      <button type="button" class="c-btn" data-p="pa" style="background:linear-gradient(135deg,#ff9ff3,#feca57,#48dbfb)"></button>
    </div>
    <div>
      <span class="label">⭐ Pick Shape</span>
      <button type="button" class="s-btn active" data-s="box">⬜ Box</button>
      <button type="button" class="s-btn" data-s="cloud">☁️ Cloud</button>
      <button type="button" class="s-btn" data-s="heart">❤️ Heart</button>
    </div>
  </div>
  <button type="button" class="go-btn" id="go">Make My Cloud! 🎉</button>
  <div id="cloud"></div>
</div>
<script>
const pals = {
  pg: "#8854d0,#718093,#9c88ff,#2f3640,#6f11d1,#a55eea,#57606f".split(","),
  br: "#ff4757,#2ed573,#1e90ff,#ffa502,#34495e,#ff6b81,#20bf6b".split(","),
  pa: "#ff9ff3,#feca57,#ff6b81,#48dbfb,#a29bfe,#20bf6b".split(",")
};
const sizes = "20,24,28,32,36".split(",").map(Number);
let curP = "pg", curS = "box";

function pick(arr) {
  return arr.at(Math.floor(Math.random() * arr.length));
}

document.querySelectorAll(".c-btn").forEach(function(b) {
  b.onclick = function() {
    curP = b.dataset.p;
    document.querySelectorAll(".c-btn").forEach(function(x) { x.classList.remove("active"); });
    b.classList.add("active");
    if (document.getElementById("txt").value.trim()) buildCloud();
  };
});

document.querySelectorAll(".s-btn").forEach(function(b) {
  b.onclick = function() {
    curS = b.dataset.s;
    document.querySelectorAll(".s-btn").forEach(function(x) { x.classList.remove("active"); });
    b.classList.add("active");
    if (document.getElementById("txt").value.trim()) buildCloud();
  };
});

function ptInShape(x, y, s) {
  let nx = (x - 0.5) * 2;
  let ny = (0.5 - y) * 2;
  if (s === "box") {
    return Math.abs(nx) < 0.85 && Math.abs(ny) < 0.85;
  }
  if (s === "cloud") {
    let c1 = (nx * nx) / 0.25 + ((ny - 0.15) * (ny - 0.15)) / 0.25 < 1;
    let c2 = ((nx + 0.42) * (nx + 0.42)) / 0.20 + ((ny + 0.08) * (ny + 0.08)) / 0.16 < 1;
    let c3 = ((nx - 0.42) * (nx - 0.42)) / 0.20 + ((ny + 0.08) * (ny + 0.08)) / 0.16 < 1;
    let base = Math.abs(nx) < 0.55 && ny > -0.45 && ny < 0.15;
    return c1 || c2 || c3 || base;
  }
  if (s === "heart") {
    let hx = nx * 1.15;
    let hy = (ny + 0.15) * 1.15;
    return Math.pow(hx * hx + hy * hy - 1, 3) - hx * hx * Math.pow(hy, 3) < 0;
  }
  return true;
}

function boxInShape(cx, cy, ww, wh, W, H, s) {
  let hw = (ww / 2) / W;
  let hh = (wh / 2) / H;
  let x = cx / W;
  let y = cy / H;
  return ptInShape(x, y, s) &&
         ptInShape(x - hw, y - hh, s) &&
         ptInShape(x + hw, y - hh, s) &&
         ptInShape(x - hw, y + hh, s) &&
         ptInShape(x + hw, y + hh, s);
}

function getGuideSVG(s) {
  if (s === "cloud") {
    return '<svg id="shape-bg" viewBox="0 0 100 100" preserveAspectRatio="none"><path d="M25,72 L75,72 A18,18 0 0,0 78,37 A24,24 0 0,0 32,33 A18,18 0 0,0 25,72 Z" fill="#f3e8ff" stroke="#d8b4fe" stroke-width="1" stroke-dasharray="2,2"/></svg>';
  }
  if (s === "heart") {
    return '<svg id="shape-bg" viewBox="0 0 100 100" preserveAspectRatio="none"><path d="M50,88 C50,88 10,60 10,32 A20,20 0 0,1 50,24 A20,20 0 0,1 90,32 C90,60 50,88 50,88 Z" fill="#f3e8ff" stroke="#d8b4fe" stroke-width="1" stroke-dasharray="2,2"/></svg>';
  }
  return "";
}

function buildCloud() {
  const raw = document.getElementById("txt").value.toLowerCase().split(/\W+/);
  const words = Array.from(new Set(raw)).filter(function(w) { return w.length > 0; });
  if (!words.length) return alert("Type some words first!");
  
  words.sort(function(a, b) { return b.length - a.length; });

  const box = document.getElementById("cloud");
  box.innerHTML = getGuideSVG(curS);
  box.style.display = "block";
  const W = box.offsetWidth, H = box.offsetHeight, placed = new Array();

  words.forEach(function(w) {
    const el = document.createElement("span");
    el.className = "word";
    el.textContent = w;
    el.style.color = pick(pals.pg);
    if (curP === "br") el.style.color = pick(pals.br);
    if (curP === "pa") el.style.color = pick(pals.pa);
    
    let sz = pick(sizes);
    if (words.length > 18) sz = Math.max(16, sz - 6);
    el.style.fontSize = sz + "px";
    box.appendChild(el);
    
    const ww = el.offsetWidth || w.length * sz * 0.6;
    const wh = el.offsetHeight || sz * 1.1;
    let ok = false, tries = 0, fx = W / 2, fy = H / 2;

    while (!ok && tries < 600) {
      let lx = Math.random() * 0.84 + 0.08;
      let ty = Math.random() * 0.84 + 0.08;
      let tx = lx * W;
      let ty2 = ty * H;
      if (boxInShape(tx, ty2, ww, wh, W, H, curS)) {
        let r = { l: tx - ww / 2, r: tx + ww / 2, t: ty2 - wh / 2, b: ty2 + wh / 2 };
        if (!placed.some(function(p) { return !(r.r + 4 < p.l || r.l - 4 > p.r || r.b + 4 < p.t || r.t - 4 > p.b); })) {
          ok = true;
          fx = tx;
          fy = ty2;
          placed.push(r);
        }
      }
      tries++;
    }
    el.style.left = fx + "px";
    el.style.top = fy + "px";
  });
}

document.getElementById("go").onclick = buildCloud;
</script>
</body>
</html>
